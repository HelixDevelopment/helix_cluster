name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  golangci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: >
            --enable=bodyclose,depguard,dogsled,dupl,errcheck,gochecknoinits,
            goconst,gocritic,gocyclo,gofmt,goimports,gomnd,goprintffuncname,
            gosec,gosimple,govet,ineffassign,lll,misspell,nakedret,noctx,
            nolintlint,rowserrcheck,staticcheck,structcheck,stylecheck,
            typecheck,unconvert,unparam,unused,whitespace

  zigtidy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: '0.14.0'

      - name: zigtidy
        run: |
          # zigtidy is not yet a standard tool; placeholder for future integration
          echo "zigtidy check skipped (tool not available in CI)"
