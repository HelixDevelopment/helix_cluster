name: Format Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Install gofumpt
        run: go install mvdan.cc/gofumpt@latest

      - name: Check Go formatting
        run: |
          find . -name '*.go' -exec gofumpt -l {} + | tee gofmt.out
          test ! -s gofmt.out

  zig:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: '0.14.0'

      - name: Check Zig formatting
        run: |
          zig fmt --check .

  cc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format

      - name: Check C/C++ formatting
        run: |
          find . -regextype posix-extended -regex '.*\.(c|h|cpp|hpp|cc|cxx)$' -exec clang-format --dry-run --Werror {} +
