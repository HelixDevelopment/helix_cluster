apiVersion: apps/v1
kind: Deployment
metadata:
  name: helix-llm
  namespace: helix-cluster
  labels:
    app.kubernetes.io/name: helix-llm
    app.kubernetes.io/component: llm
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: helix-llm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: helix-llm
        app.kubernetes.io/component: llm
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: llm
          image: helixcluster/helix-llm:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 50057
              name: grpc
          envFrom:
            - configMapRef:
                name: helix-config
          livenessProbe:
            grpc:
              port: 50057
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            grpc:
              port: 50057
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "4Gi"
              cpu: "2000m"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: helix-llm
  namespace: helix-cluster
  labels:
    app.kubernetes.io/name: helix-llm
    app.kubernetes.io/component: llm
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: helix-llm
  ports:
    - port: 50057
      targetPort: 50057
      name: grpc
