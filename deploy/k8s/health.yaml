apiVersion: apps/v1
kind: Deployment
metadata:
  name: helix-health
  namespace: helix-cluster
  labels:
    app.kubernetes.io/name: helix-health
    app.kubernetes.io/component: health
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: helix-health
  template:
    metadata:
      labels:
        app.kubernetes.io/name: helix-health
        app.kubernetes.io/component: health
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: health
          image: helixcluster/helix-health:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 50055
              name: grpc
          envFrom:
            - configMapRef:
                name: helix-config
          livenessProbe:
            grpc:
              port: 50055
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            grpc:
              port: 50055
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: helix-health
  namespace: helix-cluster
  labels:
    app.kubernetes.io/name: helix-health
    app.kubernetes.io/component: health
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: helix-health
  ports:
    - port: 50055
      targetPort: 50055
      name: grpc
