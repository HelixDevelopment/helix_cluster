apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: helix-agent
  namespace: helix-cluster
  labels:
    app.kubernetes.io/name: helix-agent
    app.kubernetes.io/component: agent
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: helix-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: helix-agent
        app.kubernetes.io/component: agent
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: agent
          image: helixcluster/helix-agent:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 50059
              name: grpc
              hostPort: 50059
          envFrom:
            - configMapRef:
                name: helix-config
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          livenessProbe:
            grpc:
              port: 50059
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            grpc:
              port: 50059
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          securityContext:
            # privileged is REQUIRED: the host-agent introspects the node's real
            # /proc and /sys to report measured resource state (CLAUDE-2 — no mock
            # host metrics). readOnlyRootFilesystem still applies: the agent writes
            # nothing to its own container rootfs (host mounts below are readOnly).
            privileged: true
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: proc
              mountPath: /host/proc
              readOnly: true
            - name: sys
              mountPath: /host/sys
              readOnly: true
      volumes:
        - name: proc
          hostPath:
            path: /proc
        - name: sys
          hostPath:
            path: /sys
