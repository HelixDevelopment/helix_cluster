apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "helix-cluster.fullname" . }}-security
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "helix-cluster.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount.security }}
  selector:
    matchLabels:
  template:
    metadata:
      labels:
        {{- include "helix-cluster.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "helix-cluster.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: security
          image: "{{ .Values.image.registry }}/helix-security:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.config.ports.security }}
              name: grpc
          envFrom:
            - configMapRef:
                name: {{ include "helix-cluster.fullname" . }}-config
          livenessProbe:
            grpc:
              port: {{ .Values.config.ports.security }}
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            grpc:
              port: {{ .Values.config.ports.security }}
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources.security | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "helix-cluster.fullname" . }}-security
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "helix-cluster.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
  ports:
    - port: {{ .Values.config.ports.security }}
      targetPort: {{ .Values.config.ports.security }}
      name: grpc
