apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "helix-cluster.fullname" . }}-agent
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "helix-cluster.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
  template:
    metadata:
      labels:
        {{- include "helix-cluster.selectorLabels" . | nindent 8 }}
    spec:
      # hostNetwork is REQUIRED (KSV-0009 kept): the node agent runs the WireGuard
      # mesh data plane and SWIM gossip on the host network namespace; without it
      # peer hole-punching and host-port reachability for the cluster mesh break.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      serviceAccountName: {{ include "helix-cluster.serviceAccountName" . }}
      securityContext:
        # Pod-level hardening (KSV-0118): force the RuntimeDefault seccomp profile
        # for every container so syscalls are filtered to the runtime default set.
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent
          image: "{{ .Values.image.registry }}/helix-agent:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            # hostPort is REQUIRED (KSV-0024 kept): mesh peers reach this agent at a
            # stable node-level port over hostNetwork; a dynamic ClusterIP port
            # would break direct node-to-node gRPC discovery.
            - containerPort: {{ .Values.config.ports.agent }}
              name: grpc
              hostPort: {{ .Values.config.ports.agent }}
          envFrom:
            - configMapRef:
                name: {{ include "helix-cluster.fullname" . }}-config
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          livenessProbe:
            grpc:
              port: {{ .Values.config.ports.agent }}
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            grpc:
              port: {{ .Values.config.ports.agent }}
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources.agent | nindent 12 }}
          securityContext:
            # KSV-0017 cleared: privileged dropped. The agent introspects the node's
            # real /proc and /sys (CLAUDE-2 — no mock host metrics) via the read-only
            # host mounts below; /proc/{cpuinfo,meminfo} and /sys DRM entries are
            # world-readable and need NO privileged mode. Capabilities are dropped to
            # ALL, then NET_ADMIN is added back — the only capability required, for
            # the WireGuard mesh data plane (interface + routing management).
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              add:
                - NET_ADMIN
          volumeMounts:
            - name: proc
              mountPath: /host/proc
              readOnly: true
            - name: sys
              mountPath: /host/sys
              readOnly: true
      # hostPath /proc + /sys are REQUIRED (KSV-0121 kept): they are the only source
      # of real, measured node CPU/memory/GPU state (CLAUDE-2). Both are mounted
      # readOnly above, so the agent cannot mutate host state through them.
      volumes:
        - name: proc
          hostPath:
            path: /proc
        - name: sys
          hostPath:
            path: /sys
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
