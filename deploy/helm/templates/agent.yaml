apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "helix-cluster.fullname" . }}-agent
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "helix-cluster.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
  template:
    metadata:
      labels:
        {{- include "helix-cluster.selectorLabels" . | nindent 8 }}
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      serviceAccountName: {{ include "helix-cluster.serviceAccountName" . }}
      containers:
        - name: agent
          image: "{{ .Values.image.registry }}/helix-agent:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.config.ports.agent }}
              name: grpc
              hostPort: {{ .Values.config.ports.agent }}
          envFrom:
            - configMapRef:
                name: {{ include "helix-cluster.fullname" . }}-config
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          livenessProbe:
            grpc:
              port: {{ .Values.config.ports.agent }}
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            grpc:
              port: {{ .Values.config.ports.agent }}
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources.agent | nindent 12 }}
          securityContext:
            privileged: true
          volumeMounts:
            - name: proc
              mountPath: /host/proc
              readOnly: true
            - name: sys
              mountPath: /host/sys
              readOnly: true
      volumes:
        - name: proc
          hostPath:
            path: /proc
        - name: sys
          hostPath:
            path: /sys
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
