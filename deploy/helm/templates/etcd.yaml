apiVersion: v1
kind: Service
metadata:
  name: {{ include "helix-cluster.fullname" . }}-etcd
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "helix-cluster.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - port: 2379
      targetPort: 2379
      name: client
    - port: 2380
      targetPort: 2380
      name: peer
  selector:
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "helix-cluster.fullname" . }}-etcd
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "helix-cluster.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "helix-cluster.fullname" . }}-etcd
  replicas: {{ .Values.etcd.replicas }}
  selector:
    matchLabels:
  template:
    metadata:
      labels:
        {{- include "helix-cluster.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "helix-cluster.serviceAccountName" . }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values:
                        - {{ include "helix-cluster.name" . }}-etcd
                topologyKey: kubernetes.io/hostname
      containers:
        - name: etcd
          image: "{{ .Values.etcd.image.repository }}:{{ .Values.etcd.image.tag }}"
          imagePullPolicy: {{ .Values.etcd.image.pullPolicy }}
          command:
            - /usr/local/bin/etcd
            - --name
            - $(POD_NAME)
            - --data-dir
            - /etcd-data
            - --listen-client-urls
            - http://0.0.0.0:2379
            - --advertise-client-urls
            - http://$(POD_NAME).{{ include "helix-cluster.fullname" . }}-etcd.{{ .Release.Namespace }}.svc.cluster.local:2379
            - --listen-peer-urls
            - http://0.0.0.0:2380
            - --initial-advertise-peer-urls
            - http://$(POD_NAME).{{ include "helix-cluster.fullname" . }}-etcd.{{ .Release.Namespace }}.svc.cluster.local:2380
            - --initial-cluster
            - "{{ range $i := until (int .Values.etcd.replicas) }}{{ if $i }},{{ end }}{{ include "helix-cluster.fullname" $ }}-etcd-{{ $i }}=http://{{ include "helix-cluster.fullname" $ }}-etcd-{{ $i }}.{{ include "helix-cluster.fullname" $ }}-etcd.{{ $.Release.Namespace }}.svc.cluster.local:2380{{ end }}"
            - --initial-cluster-token
            - helix-cluster-etcd
            - --initial-cluster-state
            - new
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: ETCDCTL_API
              value: "3"
          ports:
            - containerPort: 2379
              name: client
            - containerPort: 2380
              name: peer
          livenessProbe:
            exec:
              command:
                - etcdctl
                - endpoint
                - health
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - etcdctl
                - endpoint
                - health
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.etcd.resources | nindent 12 }}
          {{- if .Values.etcd.persistence.enabled }}
          volumeMounts:
            - name: etcd-data
              mountPath: /etcd-data
          {{- end }}
  {{- if .Values.etcd.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: etcd-data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.etcd.persistence.storageClass }}
        storageClassName: {{ .Values.etcd.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.etcd.persistence.size }}
  {{- end }}
