# Production overrides for security, resource limits, and restart policies
services:
  helixd:
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 512M
      placement:
        constraints:
          - node.labels.helix.core == true
    tmpfs:
      - /tmp:noexec,nosuid,size=100m

  helix-gateway:
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 128M
      placement:
        constraints:
          - node.labels.helix.gateway == true
    tmpfs:
      - /tmp:noexec,nosuid,size=50m

  helix-agent:
