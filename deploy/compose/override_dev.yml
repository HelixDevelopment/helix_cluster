# Development overrides for hot reload, debug ports, and live reload
services:
  helixd:
    build:
      target: builder
    command: ["air", "-c", ".air.toml"]
    volumes:
      - ../../:/app:cached
      - ../../.env:/app/.env:ro
    environment:
      HELIX_LOG_LEVEL: debug
      HELIX_PPROF_ENABLED: "true"
      HELIX_PPROF_ADDR: "0.0.0.0:6060"
    ports:
      - "6060:6060"   # pprof
      - "40000:40000" # Delve debug

  helix-gateway:
    build:
      target: builder
    command: ["air", "-c", ".air.toml"]
    volumes:
      - ../../:/app:cached
      - ../../.env:/app/.env:ro
    environment:
      HELIX_LOG_LEVEL: debug
      HELIX_PPROF_ENABLED: "true"
      HELIX_PPROF_ADDR: "0.0.0.0:6061"
    ports:
      - "6061:6061"   # pprof
      - "40001:40000" # Delve debug

  helix-agent:
    volumes:
      - ../../:/app:cached
      - ../../.env:/app/.env:ro
    environment:
      HELIX_LOG_LEVEL: debug
      HELIX_PPROF_ENABLED: "true"
      HELIX_PPROF_ADDR: "0.0.0.0:6062"
    ports:
      - "6062:6062"   # pprof
      - "40002:40000" # Delve debug

  prometheus:
    ports:
      - "9090:9090"

  grafana:
    ports:
      - "3000:3000"

  jaeger:
    ports:
      - "16686:16686"
      - "14268:14268"
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
