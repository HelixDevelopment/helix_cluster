\* TLC configuration for the Two-Phase Commit (2PC) atomic-commit spec.
\*
\* Tiny but MEANINGFUL bound: 3 Resource Managers + 1 (implicit) Transaction
\* Manager. Three RMs is small enough for TLC to EXHAUSTIVELY explore the full
\* finite state space to completion in well under the time budget, yet large
\* enough that the atomicity-threatening interleavings are actually reachable:
\*   - some RMs prepare while another unilaterally aborts (NO vote) -> the TM
\*     must NOT be able to reach global commit, so no RM may commit;
\*   - all RMs prepare, the TM commits, and every RM commits (happy path);
\*   - the TM aborts after some RMs prepared, and prepared RMs must abort.
\* Under a wrong decision rule (TM commits without all-prepared, or an RM
\* commits without the TM's Commit), Consistency / Decisiveness would fail --
\* the mutation run (TwoPhaseCommitMut) proves the invariants have teeth.
\*
\* SYMMETRY over the interchangeable RM ids collapses the otherwise redundant
\* permutations so the run finishes fast.
\*
\* RUN WITH -deadlock: 2PC is a TERMINATING protocol -- once every RM has
\* committed/aborted and the TM has decided, there is no enabled next action.
\* That is a correct terminal state, NOT a livelock, so deadlock checking is
\* intentionally disabled:
\*   java -cp specs/tla2tools.jar tlc2.TLC -deadlock \
\*        -config specs/TwoPhaseCommit.cfg specs/TwoPhaseCommit.tla
SPECIFICATION Spec

CONSTANTS
    RMs = {r1, r2, r3}

SYMMETRY Symmetry

INVARIANT TypeOK
INVARIANT Consistency
INVARIANT Decisiveness
INVARIANT CommitImpliesGlobalCommit
