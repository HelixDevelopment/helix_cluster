\* TLC configuration for the RENDEZVOUS (HRW) consistent-hashing spec -- the
\* CORRECT run (UseModulo = FALSE => OwnerOf = HRW max-weight owner).
\*
\* Tiny but MEANINGFUL bound: 3 keys, 3 candidate nodes, with a FIXED concrete
\* per-key total order (Rank) so the model is finite and fully deterministic.
\* Distinct Rank permutations per key make the disruption set genuinely vary by
\* key, so MinimalDisruption is non-trivially exercised. Small enough for TLC to
\* EXHAUSTIVELY explore the full finite state space to completion well under the
\* time budget, large enough that:
\*   - an ADD moves SOME keys (those preferring the new node) but not all,
\*   - a REMOVE reassigns only the removed node's keys,
\* are both reachable (proven by the non-vacuity witnesses).
\*
\* No SYMMETRY: Rank is a constant that distinguishes nodes (and keys) by
\* identity, so permuting ids is UNSOUND here. The tiny bound keeps the run
\* fast without symmetry reduction.
\*
\* -deadlock is disabled via the runner flag: once membership has shrunk to a
\* single live node, Remove is guarded off and (if all nodes already cycled)
\* the model can reach a state with no further DISTINCT membership move -- a
\* benign terminal, not a bug. (In practice Add re-enables moves, but we run
\* with -deadlock to be safe about any quiescent membership fixpoint.)
SPECIFICATION Spec

CONSTANTS
    n1 = n1   n2 = n2   n3 = n3        \* node model values
    k1 = k1   k2 = k2   k3 = k3        \* key model values
    Keys      = {k1, k2, k3}
    Nodes     = {n1, n2, n3}
    UseModulo = FALSE

\* Fixed per-key total order (the deterministic weight function, as a constant):
\* k1: n1>n2>n3, k2: n2>n3>n1, k3: n3>n1>n2 -- defined as RankDef in the module.
CONSTANT Rank <- RankDef

INVARIANT TypeOK
INVARIANT UniqueDeterministicOwner
INVARIANT HRWMaxWeightOwner

\* The DEFINING HRW law, as a single-step action property: across any add/remove
\* exactly the minimal necessary set of keys changes owner.
PROPERTY MinimalDisruption
