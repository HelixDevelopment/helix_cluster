\* TLC configuration for the HYBRID LOGICAL CLOCK (Kulkarni et al.) spec.
\*
\* Tiny but MEANINGFUL bound: 2 nodes, physical domain 0..2, 4 total events,
\* 2 messages. Small enough for TLC to EXHAUSTIVELY explore the full finite
\* state space to completion well under the time budget, yet large enough that
\* the interesting HLC behaviours are all reachable:
\*   - a node's physical clock can stall while it produces several events,
\*     forcing the COUNTER (c) to compensate (Now bumps c when l doesn't move);
\*   - the two nodes can be SKEWED (one ticks ahead of the other), so a
\*     RECEIVE merges a remote stamp whose l exceeds the receiver's own pt --
\*     this is the case where the receiver's HLC must rise ABOVE its physical
\*     clock to dominate the sender (the message happens-before edge);
\*   - a Send followed by a Receive on the other node exercises the full
\*     send-stamp -> merge path that CausalityRespected guards.
\*
\* SYMMETRY over the interchangeable node ids collapses redundant permutations.
\* It is sound: the algorithm treats all node ids identically and message ids
\* are mint-order counters (not permuted).
SPECIFICATION Spec

CONSTANTS
    Nodes     = {n1, n2}
    MaxPT     = 2
    MaxEvents = 4
    MaxMsgs   = 2

SYMMETRY Symmetry

INVARIANT TypeOK
INVARIANT CausalityRespected
INVARIANT BoundedDivergence
INVARIANT LMonotone
INVARIANT CounterBounded
