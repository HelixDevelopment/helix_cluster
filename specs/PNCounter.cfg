\* TLC configuration for the PN-Counter (Positive-Negative Counter) CRDT spec.
\*
\* Tiny but MEANINGFUL bound: 2 replicas, <=2 Increments AND <=2 Decrements
\* per replica. Small enough for TLC to EXHAUSTIVELY explore the full finite
\* state space to completion well under the time budget, yet large enough that
\* the divergence-prone scenarios are reachable:
\*   - both replicas concurrently Increment (each bumps its own P slot),
\*   - one replica Increments while the other concurrently Decrements,
\* so that a WRONG merge (SUM instead of MAX) actually OVERCOUNTS and the
\* Convergence invariant fails — the mutation run (PNCounterMut) proves it.
\*
\* SYMMETRY over the interchangeable replica ids collapses redundant
\* permutations so the run finishes fast. -deadlock is NOT set as a hard
\* requirement: once every replica has incremented/decremented to MaxOps and
\* fully gossiped, no action is enabled, so the system reaches a genuine
\* quiescent terminal state. We therefore run TLC with -deadlock disabled
\* (via the runner flag) because reaching that quiescent fixpoint is the
\* CORRECT, expected behaviour — not a bug.
SPECIFICATION Spec

CONSTANTS
    Replicas = {r1, r2}
    MaxOps   = 2

SYMMETRY Symmetry

INVARIANT TypeOK
INVARIANT Convergence

\* SEC join-semilattice law (action property): per-slot knowledge never
\* shrinks. Distinguishes a correct MAX merge from a broken SUM merge
\* (SUM still grows, so this passes under SUM; Convergence is what catches SUM).
PROPERTY MergeMonotonicity
