\* TLC configuration for the Scheduling spec (HXC-1139).
\* Small but genuinely contended: 3 tasks compete for 2 single-unit
\* resources, so two tasks CAN target the same resource concurrently.
SPECIFICATION Spec

CONSTANTS
    Tasks      = {t1, t2, t3}
    Resources  = {r1, r2}
    NoTask     = NoTask
    NoResource = NoResource
    MaxVersion = 4

CONSTRAINT VersionBounded

INVARIANT NoDoubleBind
INVARIANT ConsistentOwnership
INVARIANT TypeOK
