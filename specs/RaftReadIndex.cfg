\* TLC configuration for the RaftReadIndex (lease-free linearizable reads)
\* spec -- MAIN run: the correct protocol, heartbeat confirmation ENABLED.
\*
\* Tiny but MEANINGFUL bound. 3 servers is the minimum that yields TWO
\* DISTINCT quorums across two terms, which is what creates the stale-leader
\* hazard: a new leader can be elected by a quorum at a higher term while the
\* old leader (and a server outside the new quorum) remains in the old term.
\* Bounded terms (election count) and bounded committed writes keep the state
\* space small enough for TLC to EXHAUSTIVELY explore to completion well
\* under the time budget, while still reaching:
\*   - a ReadIndex read served AFTER a heartbeat-quorum confirmation (the real
\*     protocol fast path), and
\*   - a re-election to a higher term followed by a commit under the new
\*     leader, which freezes the old leader's commit view strictly behind the
\*     global `committed` -- the exact configuration where dropping the
\*     heartbeat gate would serve a stale value. The mutation cfg
\*     (RaftReadIndexMut) sets ConfirmHeartbeat = FALSE and TLC reaches that
\*     stale read as a LinearizableRead counterexample.
\*
\* SYMMETRY on Servers is SOUND: server ids are interchangeable model values
\* -- the spec never orders them, Quorum is defined purely by cardinality,
\* and every invariant is symmetric under any permutation of Servers.
\* Permuting ids maps reachable states to reachable states preserving all
\* checked properties, so symmetry-reduction loses no behaviour.
\*
\* RUN WITH -deadlock: the bounded model has natural terminal states (terms
\* and writes exhausted, nothing left enabled). That is a correct dead end of
\* the BOUNDED model, not a livelock, so deadlock checking is disabled:
\*   java -cp specs/tla2tools.jar tlc2.TLC -deadlock \
\*        -config specs/RaftReadIndex.cfg specs/RaftReadIndex.tla
SPECIFICATION Spec

CONSTANTS
    Servers          = {s1, s2, s3}
    MaxTerm          = 3
    MaxWrites        = 2
    ConfirmHeartbeat = TRUE
    Nil              = Nil

SYMMETRY Symm

INVARIANT TypeOK
INVARIANT LinearizableRead
INVARIANT CommitMonotonic
