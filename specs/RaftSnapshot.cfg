\* TLC configuration for RaftSnapshot -- MAIN run: the CORRECT mechanism.
\* Both mutation flags OFF, so:
\*   - COMPACT only at snapIndex <= commitIndex (never snapshot ahead of commit)
\*   - INSTALL materialises the full covered prefix on the lagging follower
\*
\* Tiny but MEANINGFUL bound. Two followers are enough to exercise symmetry
\* and independent lag/install/append interleavings; MaxIndex = 3 is the
\* smallest domain that yields a real "compact past a follower's log end then
\* install" gap: the leader can commit to 3, snapshot at 2, and a follower
\* sitting at log end 0/1 (BELOW the snapshot) can no longer be caught up by
\* plain append (entries <= 2 are gone from the leader) -- only InstallSnapshot
\* bridges it. That is exactly the FileSnapshotStore + InstallSnapshot path in
\* pkg/raft. The bounded state space is explored EXHAUSTIVELY to completion
\* (0 states left on queue) well under the time budget.
\*
\* SYMMETRY on Followers is SOUND: follower ids are interchangeable model
\* values -- the spec never orders them, every action quantifies \E/\A f and
\* every invariant is symmetric under any permutation of Followers. Permuting
\* ids maps reachable states to reachable states preserving all checked
\* properties, so symmetry reduction loses no behaviour.
\*
\* RUN WITH -deadlock: the bounded model has natural terminal states (commit,
\* snapshot, and all follower catch-up exhausted -- nothing enabled). That is
\* a correct dead end of the BOUNDED model, not a livelock, so deadlock
\* checking is disabled:
\*   java -cp specs/tla2tools.jar tlc2.TLC -deadlock \
\*        -config specs/RaftSnapshot.cfg specs/RaftSnapshot.tla
SPECIFICATION Spec

CONSTANTS
    Followers         = {f1, f2}
    MaxIndex          = 3
    AllowBadCompact   = FALSE
    AllowLossyInstall = FALSE

SYMMETRY Symmetry

INVARIANT TypeOK
INVARIANT NoCommittedEntryLost
INVARIANT SnapshotInstallCorrect
