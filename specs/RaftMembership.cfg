\* TLC configuration for the Raft single-server MEMBERSHIP CHANGE spec.
\*
\* 4 candidate servers, chain bounded to 4 configs, 2 decision values. This is
\* small enough to explore the FULL finite state space to completion in seconds,
\* yet large enough to be meaningful: with 4 servers a SINGLE-server change keeps
\* old/new majorities overlapping, but a TWO-at-once change (the mutation) can
\* split into two disjoint 2-of-3 majorities -> real split-brain. 2 values are
\* the minimum needed for a CONFLICT to exist at all.
\*
\* SYMMETRY over the interchangeable server ids is sound here: no server id is
\* named in the spec or invariants, so permuting them preserves all behaviours.
SPECIFICATION Spec

CONSTANTS
    Servers    = {s1, s2, s3, s4}
    MaxConfigs = 4
    Values     = {v1, v2}
    Mutation_AllowTwoChangeAtOnce = FALSE

SYMMETRY Symmetry

INVARIANT TypeOK
INVARIANT OneServerChangeAtATime
INVARIANT QuorumOverlap
INVARIANT NoDisjointMajorities
