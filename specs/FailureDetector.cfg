\* TLC configuration for the FAILURE-DETECTOR accuracy-envelope spec.
\*
\* CORRECTLY-CONFIGURED threshold: T > MaxDelay + Interval.
\*   MaxDelay = 2, Interval = 2  =>  MaxDelay + Interval = 4
\*   T = 5  > 4                  =>  accuracy invariant HOLDS.
\*
\* A heartbeat sent at s is delivered by s + MaxDelay; an alive node re-sends
\* within Interval; so the monitor's silence on a live, responsive node never
\* exceeds MaxDelay + Interval = 4 < T = 5, and it is never falsely suspected.
\*
\* MaxClock = 6 bounds the logical clock. Tiny (one monitor + one monitored
\* node, clock 0..6, in-flight send-times in 0..6) yet large enough that:
\*   - the heartbeat pipeline primes and a within-bound healthy state is
\*     reached (HealthyObservedReachable witness), and
\*   - after a crash the silence grows past T = 5 and a TRUE suspicion is
\*     reached (TrueSuspicionReachable witness).
\* This makes the full state space exhaustively explorable to completion well
\* under the time budget.
\*
\* No SYMMETRY: there is a single monitored node and the state is over a
\* numeric clock domain, so there is no interchangeable-id symmetry to exploit.
\* The system legitimately TERMINATES (clock reaches MaxClock, all heartbeats
\* drained) -> -deadlock is passed on the command line so terminal states are
\* not flagged as deadlocks.
SPECIFICATION Spec

CONSTANTS
    MaxClock = 6
    MaxDelay = 2
    Interval = 2
    T        = 5

INVARIANT TypeOK
INVARIANT NoFalseSuspicionWithinBound
INVARIANT UnsuspectOnFreshHeartbeat
INVARIANT SuspectImpliesStale
