\* TLC configuration for the RaftPreVote (disruption-avoidance) spec --
\* MAIN run: the correct protocol, PreVote ENABLED.
\*
\* Tiny but MEANINGFUL bound. 3 servers is the minimum that yields a stable
\* leader supported by a connected majority PLUS one partitioned/restarted
\* outsider -- the classic disruptive-node setup. Bounded terms (election
\* count) and a tiny log up-to-dateness rank domain keep the state space small
\* enough for TLC to EXHAUSTIVELY explore to completion well under the time
\* budget, while still reaching:
\*   - a partitioned, stale node running a pre-vote round that FAILS (peers
\*     refuse: they still hear the leader and/or its log is behind), with the
\*     stable leader left untouched at the same term, AND
\*   - a legitimately better-positioned node winning a pre-vote and proceeding
\*     to a real election (the good path -- PreVote is not blocking all
\*     elections).
\* The mutation cfg (RaftPreVoteMut) sets PreVoteEnabled = FALSE; TLC then
\* reaches a state where the stale partitioned node bumps its term and deposes
\* the stable leader -> disrupted = TRUE, a NoDisruptionByStaleNode
\* counterexample.
\*
\* SYMMETRY on Servers is SOUND: server ids are interchangeable model values
\* -- the spec never orders them, Quorum is defined purely by cardinality, and
\* every checked invariant/property is symmetric under any permutation of
\* Servers. Permuting ids maps reachable states to reachable states preserving
\* all checked properties, so symmetry-reduction loses no behaviour.
\*
\* RUN WITH -deadlock: the bounded model has natural terminal states (terms
\* exhausted, nothing left enabled). That is a correct dead end of the BOUNDED
\* model, not a livelock, so deadlock checking is disabled:
\*   java -cp specs/tla2tools.jar tlc2.TLC -deadlock \
\*        -config specs/RaftPreVote.cfg specs/RaftPreVote.tla
SPECIFICATION Spec

CONSTANTS
    Servers        = {s1, s2, s3}
    MaxTerm        = 3
    MaxRank        = 1
    PreVoteEnabled = TRUE
    Nil            = Nil

SYMMETRY Symm

INVARIANT TypeOK
INVARIANT NoDisruptionByStaleNode
INVARIANT ElectionSafety

PROPERTY PreVoteDoesNotChangeTerm
