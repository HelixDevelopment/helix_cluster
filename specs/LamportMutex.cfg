\* TLC configuration for LAMPORT's distributed mutual-exclusion spec.
\*
\* Tiny but MEANINGFUL bound: 3 processes, Lamport clocks capped at MaxClock,
\* total CS entries capped at MaxVisits. This is small enough for TLC to
\* EXHAUSTIVELY explore the full finite state space to completion (0 states on
\* queue, a couple of seconds wall time), yet large enough that the dangerous
\* scenario is reachable: MULTIPLE processes issue REQUESTs concurrently and
\* their REQUEST / ACK / RELEASE messages interleave arbitrarily over the
\* asynchronous FIFO channels. If the timestamp-ordering rule (R1) or the
\* "heard a later timestamp from everyone" rule (R2) were wrong, two processes
\* could enter the CS together -- the mutation run (drop R2) demonstrates
\* exactly that two-in-CS violation.
\*
\* 3 processes proves mutual exclusion for genuine multi-way contention; the
\* full state graph (~57k distinct states) finishes well under the time budget.
\* (A 2-process model is also exhaustively checkable -- ~151 states, sub-second
\* -- and likewise establishes the property; 3 processes is the stronger run.)
\*
\* SYMMETRY over the interchangeable process ids collapses redundant
\* permutations. Sound: every action treats ids uniformly and MutualExclusion
\* is invariant under permuting which process holds the CS.
SPECIFICATION Spec

CONSTANTS
    Processes = {p1, p2, p3}
    MaxClock  = 7
    MaxVisits = 3

SYMMETRY Symmetry

INVARIANT TypeOK
INVARIANT MutualExclusion
INVARIANT CSHasRequest

\* Lamport clocks never decrease (action property).
PROPERTY ClockMonotone
