\* TLC configuration for the Saga (long-running transaction + compensation) spec.
\*
\* Tiny but MEANINGFUL bound: N = 3 saga steps. Three steps is small enough for
\* TLC to EXHAUSTIVELY explore the full finite state space to completion in well
\* under the time budget, yet large enough that the order-sensitive rollback
\* interleavings are actually reachable and could be violated under a wrong rule:
\*   - all 3 steps succeed -> the saga commits (happy path);
\*   - step k fails after 1..(k-1) committed -> the saga compensates the done
\*     steps in REVERSE order (C_(k-1), ..., C_1) and aborts;
\*   - step 1 fails immediately -> rollback completes with nothing to undo.
\* With N >= 2 a wrong compensation order (undoing an earlier step before a
\* later committed one) would be reachable, so CompensationOrder has teeth; and
\* a rule that "forgot" to compensate a step would leave a "done" step in a
\* terminal aborted state, violating AtomicityViaCompensation. The mutation run
\* (SagaMut) demonstrates exactly the latter.
\*
\* No SYMMETRY: the step ids 1..N are ORDERED (sequence + reverse-order
\* compensation), so they are NOT interchangeable -- permutation symmetry would
\* be unsound here. The state space at N=3 is tiny regardless.
\*
\* RUN WITH -deadlock: the saga is a TERMINATING workflow -- once it reaches the
\* "committed" or "aborted" phase there is no enabled next action. That is a
\* correct terminal state, NOT a livelock, so deadlock checking is intentionally
\* disabled:
\*   java -cp specs/tla2tools.jar tlc2.TLC -deadlock \
\*        -config specs/Saga.cfg specs/Saga.tla
SPECIFICATION Spec

CONSTANTS
    N = 3

INVARIANT TypeOK
INVARIANT AtomicityViaCompensation
INVARIANT CompensationOrder
