\* TLC config -- MUTATION / TEETH run for RaftReadIndex.
\*
\* Same module, ONE constant flipped: ConfirmHeartbeat = FALSE. This DROPS
\* ReadIndex step (2) -- the leader serves a read WITHOUT confirming through a
\* fresh heartbeat quorum that it is still the leader in the current term.
\*
\* The hazard then becomes reachable: server s was the leader, a NEW leader
\* was elected at a higher term (a quorum adopted the new term and committed a
\* newer write), but s -- still recorded as `leader` here and with its commit
\* view FROZEN -- serves a read at its stale applied index. Without the gate,
\* ReadGate(s) = TRUE, so ServeRead fires and returns a value strictly below
\* the global `committed` -> lastReadValue < lastReadCommitted, a STALE READ.
\*
\* TLC MUST find a counterexample to LinearizableRead here. That counter-
\* example proves the invariant is MEANINGFUL (has teeth) and is the required
\* mutation evidence: a stale leader serving without heartbeat confirmation
\* misses a newer committed write.
\*
\* SYMMETRY is intentionally NOT declared on the mutation run -- TLC forbids
\* SYMMETRY when checking an invariant that can FAIL, since a symmetric
\* state-graph quotient can hide the very counterexample we want to surface.
\*
\*   java -cp specs/tla2tools.jar tlc2.TLC -deadlock \
\*        -config specs/RaftReadIndexMut.cfg specs/RaftReadIndex.tla
SPECIFICATION Spec

CONSTANTS
    Servers          = {s1, s2, s3}
    MaxTerm          = 3
    MaxWrites        = 2
    ConfirmHeartbeat = FALSE
    Nil              = Nil

INVARIANT TypeOK
INVARIANT LinearizableRead
INVARIANT CommitMonotonic
