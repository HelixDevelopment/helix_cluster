\* TLC configuration for the Consensus spec (HXC-1139).
\* 3 servers, terms 1..3 -- small enough to explore fully, large enough
\* that two candidates CAN race for the same term (real split-brain risk).
SPECIFICATION Spec

CONSTANTS
    Servers = {s1, s2, s3}
    MaxTerm = 3
    Nil     = Nil

INVARIANT NoSplitBrain
INVARIANT OneVotePerTerm
INVARIANT TypeOK
