\* TLC config -- MUTATION / TEETH run for RaftPreVote.
\*
\* Same module, ONE constant flipped: PreVoteEnabled = FALSE. This DROPS the
\* pre-vote gate -- a candidate no longer has to win a pre-vote round before
\* starting a REAL election. A partitioned/restarted node with a STALE log can
\* therefore increment its term directly (StartRealElection with no gate),
\* reconnect, and -- because its inflated term now exceeds the stable leader's
\* -- force that leader to step down and the cluster term to advance, even
\* though the node could NEVER have legitimately won (its log is behind / it
\* held no winning quorum).
\*
\* TLC MUST find a counterexample to NoDisruptionByStaleNode here: a state with
\* disrupted = TRUE. That counterexample proves the invariant is MEANINGFUL
\* (has teeth) and is the required mutation evidence -- plain Raft (no PreVote)
\* lets a stale node disrupt a stable leader by term inflation; PreVote
\* prevents exactly this.
\*
\* SYMMETRY is intentionally NOT declared on the mutation run -- TLC forbids
\* SYMMETRY when checking an invariant that can FAIL, since a symmetric
\* state-graph quotient can hide the very counterexample we want to surface.
\*
\*   java -cp specs/tla2tools.jar tlc2.TLC -deadlock \
\*        -config specs/RaftPreVoteMut.cfg specs/RaftPreVote.tla
SPECIFICATION Spec

CONSTANTS
    Servers        = {s1, s2, s3}
    MaxTerm        = 3
    MaxRank        = 1
    PreVoteEnabled = FALSE
    Nil            = Nil

INVARIANT TypeOK
INVARIANT NoDisruptionByStaleNode
INVARIANT ElectionSafety
