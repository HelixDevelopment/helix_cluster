\* TLC configuration for the VECTOR-CLOCK causal-delivery spec.
\*
\* Tiny but MEANINGFUL bound: 3 processes, 3 total broadcasts. That is small
\* enough for TLC to EXHAUSTIVELY explore the full finite state space to
\* completion, yet large enough that the REORDERING hazard is reachable:
\*   - process A broadcasts m1;
\*   - process B delivers m1 then broadcasts m2 (m2 --hb--> depends on m1);
\*   - process C can receive m2 into its buffer BEFORE m1 -- correct causal
\*     delivery must HOLD m2 until m1 is delivered.
\* Under a wrong/absent guard (the mutation run) m2 is delivered early and
\* CausalDelivery fails -- that mutation produces a concrete counterexample.
\*
\* SYMMETRY over the interchangeable process ids collapses redundant
\* permutations so the run finishes well under the time budget. It is sound:
\* the protocol treats all process ids identically, and message ids are just
\* mint-order counters, not permuted by Permutations(Processes).
SPECIFICATION Spec

CONSTANTS
    Processes = {p1, p2, p3}
    MaxSends  = 3

SYMMETRY Symmetry

INVARIANT TypeOK
INVARIANT CausalDelivery
INVARIANT NoDuplicateDelivery
INVARIANT GuardConsistency

\* Vector clocks never decrease (action property).
PROPERTY MonotoneVC
