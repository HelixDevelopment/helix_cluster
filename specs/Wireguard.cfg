\* TLC configuration for the WireGuard Noise IK handshake spec (HXC-WIREGUARD).
\* Tiny finite model so TLC EXHAUSTIVELY finishes well under the time budget:
\*   2 initiators + 1 responder, handshake counters 0..2.
\* This is large enough for the meaningful adversarial runs:
\*   - two initiators race for the one responder (cross-session key-confusion
\*     risk that SessionAgreement must rule out), and
\*   - a single initiator re-keys (sends ctr 1 then 2) while the attacker
\*     REPLAYS the earlier (stale-counter) initiation -- exactly the replay
\*     that NoReplayAcceptance must reject.
\* Initiators and Responders are interchangeable within their own role, so we
\* declare Permutations over each as SYMMETRY to shrink the state space and let
\* TLC explore the FULL finite space to completion.
SPECIFICATION Spec

CONSTANTS
    Initiators = {i1, i2}
    Responders = {r1}
    MaxCounter = 2
    Nil        = Nil

SYMMETRY Symmetry

INVARIANT TypeOK
INVARIANT SessionAgreement
INVARIANT NoReplayAcceptance
INVARIANT ReplayWindowSane
