\* TLC config -- cfg A: OVERLAPPING quorums, R + W > N (the safety guarantee).
\*
\* N = 3 replicas, R = 2, W = 2  =>  R + W = 4 > 3 = N.
\* Every read-quorum (any 2 of 3) intersects every write-quorum (any 2 of 3),
\* so a quorum read always sees the latest COMPLETED write. MaxWrites = 2 gives
\* two minted versions -- enough for a non-vacuous fresh read (a completed write
\* observed via the forced overlap replica) yet small enough to EXHAUSTIVELY
\* finish well inside the time budget. SYMMETRY over interchangeable replica ids
\* collapses redundant permutations.
SPECIFICATION Spec

\* The model legitimately TERMINATES (all writes minted, all read slots used,
\* no action enabled) -- that terminal state is not a bug, so deadlock checking
\* is disabled. The full finite state space is still explored exhaustively.
CHECK_DEADLOCK FALSE

CONSTANTS
    Replicas = {n1, n2, n3}
    R = 2
    W = 2
    MaxWrites = 2

SYMMETRY Symmetry

INVARIANT TypeOK
INVARIANT ReadSeesLatestComplete
INVARIANT ReadReturnsAnExistingVersion

PROPERTY MonotonicVersions
