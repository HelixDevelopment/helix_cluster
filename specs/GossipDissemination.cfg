\* TLC configuration for the gossip / epidemic dissemination CONVERGENCE spec.
\*
\* Tiny but MEANINGFUL bound: 3 nodes, ONE rumor injected at the origin (n1),
\* a directed reachability relation that may start with gaps and may Drop links
\* (transient gossip-message loss / a temporarily-unreachable node) until it
\* Heals to full connectivity. That is small enough for TLC to EXHAUSTIVELY
\* explore the FULL finite state space to COMPLETION (it terminates -- gossip
\* quiesces once everyone knows, so -deadlock is disabled), yet large enough
\* that the adversarial scenarios are reachable:
\*   - the origin must relay through an intermediary to reach a node it cannot
\*     push to directly (a down/initially-absent link), so multi-hop infection
\*     is actually exercised, not just one-hop;
\*   - a link drops mid-propagation and later heals -- the rumor finishes only
\*     because connectivity is restored before quiescence.
\* Under a wrong rule (a node that stops gossiping early, a link that never
\* heals, or knowledge that can recede) EventualConvergence / NoForget fails --
\* the mutation runs prove it.
\*
\* SYMMETRY is declared ONLY over the interchangeable NON-origin nodes
\* {n2, n3}; the origin (n1) is distinguished by Init so it is NOT included
\* (including it would be unsound). This collapses the redundant n2<->n3
\* permutations so the run finishes well under the time budget.
SPECIFICATION Spec

CONSTANTS
    Nodes  = {n1, n2, n3}
    Origin = n1

SYMMETRY Symmetry

INVARIANT TypeOK
INVARIANT MonotoneKnowledge
INVARIANT EventualConvergence

PROPERTY NoForget
