\* TLC configuration for the OR-Set (Observed-Remove Set) CRDT spec.
\*
\* Tiny but MEANINGFUL bound: 2 replicas, 2 elements, <=2 Adds per replica.
\* That is small enough for TLC to EXHAUSTIVELY explore the full finite state
\* space to completion, yet large enough that the divergence-prone scenarios
\* are actually reachable:
\*   - both replicas concurrently Add the SAME element (distinct unique tags),
\*   - one replica Removes an element while the other concurrently Adds it
\*     (observed-remove must let the concurrent add survive the merge).
\* Under a wrong merge (intersection) or a wrong remove (drop unobserved tags),
\* Convergence / AddWinsSemantics would fail -- the mutation runs prove it.
\*
\* SYMMETRY over the interchangeable replica ids collapses the otherwise
\* redundant permutations so the run finishes well under the time budget.
SPECIFICATION Spec

CONSTANTS
    Replicas = {r1, r2}
    Elements = {e1, e2}
    MaxAdds  = 2

SYMMETRY Symmetry

INVARIANT TypeOK
INVARIANT Convergence
INVARIANT AddWinsSemantics
INVARIANT TombstoneObserved

\* SEC join-semilattice law (action property): knowledge never shrinks.
\* Distinguishes a correct UNION merge from a broken INTERSECTION merge.
PROPERTY MergeMonotonicity
