\* TLC configuration for the Stonith (STONITH node-fencing safety) spec.
\*
\* Tiny but MEANINGFUL bound. 2 nodes is the minimum that makes a SECOND node
\* take over a resource from a FIRST -- hence split-brain (two active nodes) --
\* reachable at all. Bounding the number of fence actions (MaxFences) keeps the
\* state space finite and small so TLC EXHAUSTIVELY explores to completion in
\* well under the time budget, while still reaching every interesting state:
\*   - a FALSE suspicion (a still-alive node moved to Suspected),
\*   - a confirmed Fence (status Fenced, the old owner forced inactive), and
\*   - a Takeover by a survivor AFTER that fence (a completed fence-then-
\*     takeover sequence). These are proven reachable by the negated witnesses.
\*
\* SYMMETRY on Nodes is SOUND: node ids are interchangeable model values -- the
\* spec never orders them, and both safety invariants (NoDualActive,
\* TakeoverImpliesFenced) are symmetric under any permutation of Nodes. Permuting
\* node ids maps reachable states to reachable states preserving all checked
\* properties, so symmetry-reduction loses no behaviour and finds the same bugs.
\*
\* RUN WITH -deadlock: the bounded model has natural terminal states (every node
\* fenced, or the fence budget exhausted with no Up node left to suspect) where
\* no action is enabled. That is a correct dead end of the BOUNDED model, not a
\* livelock, so deadlock checking is intentionally disabled:
\*   java -cp specs/tla2tools.jar tlc2.TLC -deadlock \
\*        -config specs/Stonith.cfg specs/Stonith.tla
SPECIFICATION Spec

CONSTANTS
    Nodes     = {n1, n2}
    MaxFences = 2
    Up        = Up
    Suspected = Suspected
    Fenced    = Fenced

SYMMETRY Symm

INVARIANT TypeOK
INVARIANT NoDualActive
INVARIANT TakeoverImpliesFenced
