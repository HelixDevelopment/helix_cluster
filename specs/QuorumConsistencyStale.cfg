\* TLC config -- cfg B (MUTATION / TEETH): NON-overlapping quorums, R + W <= N.
\*
\* N = 3 replicas, R = 1, W = 1  =>  R + W = 2 <= 3 = N.
\* A read-quorum of one replica can be DISJOINT from a completed write's
\* one-replica write-quorum, so the read misses the write -> STALE READ.
\* TLC MUST find a counterexample to ReadSeesLatestComplete here; that
\* counterexample proves the invariant is meaningful (has teeth) and is the
\* required mutation evidence. Same module, only R and W changed.
\*
\* NOTE: SYMMETRY is intentionally NOT declared on the mutation run -- TLC
\* forbids SYMMETRY when checking an invariant that can fail, since a symmetric
\* state-graph quotient can hide the very counterexample we want to surface.
SPECIFICATION Spec

\* Terminating model; deadlock checking off (see main cfg). The invariant
\* violation (stale read) is found before any terminal state anyway.
CHECK_DEADLOCK FALSE

CONSTANTS
    Replicas = {n1, n2, n3}
    R = 1
    W = 1
    MaxWrites = 2

INVARIANT TypeOK
INVARIANT ReadSeesLatestComplete
INVARIANT ReadReturnsAnExistingVersion

PROPERTY MonotonicVersions
