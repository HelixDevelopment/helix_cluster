\* TLC configuration for the LeaderLease (leaseholder-local reads) spec.
\*
\* Tiny but MEANINGFUL bound. 2 nodes is the minimum that makes a lease
\* HANDOFF (one node takes the lease from another with a higher epoch) and
\* therefore a STALE READ across handoff actually reachable. The bounded
\* logical clock (0..MaxClock), bounded epochs (handoff count) and bounded
\* committed writes keep the state space small enough for TLC to EXHAUSTIVELY
\* explore to completion in well under the time budget, while still reaching:
\*   - a valid leaseholder-local read (fast path), and
\*   - a handoff to a new epoch followed by a commit under the new holder,
\*     which freezes the old holder's snapshot strictly behind `committed` --
\*     the exact configuration where a wrong validity guard would serve a
\*     stale value. The mutation cfg (LeaderLeaseMut) drops the guard and TLC
\*     reaches that stale read as a NoStaleRead counterexample.
\*
\* SYMMETRY on Nodes is SOUND: node ids are interchangeable model values --
\* the spec never orders them, and both invariants are symmetric under any
\* permutation of Nodes. Permuting node ids maps reachable states to
\* reachable states preserving all checked properties, so symmetry-reduction
\* loses no behavior.
\*
\* RUN WITH -deadlock: the system has a natural terminal state (clock at
\* MaxClock, epochs/writes exhausted) with no enabled action. That is a
\* correct dead end of the BOUNDED model, not a livelock, so deadlock
\* checking is intentionally disabled:
\*   java -cp specs/tla2tools.jar tlc2.TLC -deadlock \
\*        -config specs/LeaderLease.cfg specs/LeaderLease.tla
SPECIFICATION Spec

CONSTANTS
    Nodes    = {n1, n2}
    MaxClock = 4
    MaxEpoch = 3
    MaxWrites = 2
    LeaseLen = 2
    Nil      = Nil

SYMMETRY Symm

INVARIANT TypeOK
INVARIANT NoStaleRead
INVARIANT SingleActiveLease
