\* TLC configuration for the CHANDY-LAMPORT distributed global-snapshot spec.
\*
\* Tiny but MEANINGFUL bound: 2 processes => 2 directed FIFO channels
\* (p1->p2, p2->p1), one conserved TOKEN, snapshot run concurrently with token
\* motion. Two processes is small enough for TLC to EXHAUSTIVELY explore the
\* full finite state space to completion in well under the time budget, yet
\* large enough that the NON-TRIVIAL Chandy-Lamport case is reachable:
\*   - the initiator records itself and fires markers on its out-channel;
\*   - the token can be SENT (now in flight in a channel) and the snapshot cut
\*     taken WHILE the token is in flight -- the algorithm must record it as
\*     CHANNEL state (recChan), not lose it and not double it;
\*   - the second process records on receiving the marker, then the reverse
\*     marker closes the channel and flushes the in-flight token.
\* If the marker/recording rules were wrong (snapshot a process without
\* recording in-flight channel messages, or mis-record a channel) the recorded
\* token count would drift from 1 and ConsistentSnapshot would fail. The
\* mutation run (ChandyLamportMut.cfg + the BROKEN_NO_CHANNEL_RECORD override)
\* demonstrates exactly that -- a lost-token inconsistent snapshot.
\*
\* SYMMETRY over the interchangeable process ids collapses redundant
\* permutations so the run finishes well under budget. It is sound: the
\* protocol treats all process ids identically, and the single initial token is
\* placed at a CANONICAL chosen process (StartProc), not at a permuted constant.
\*
\* RUN WITH -deadlock: the snapshot is a TERMINATING sub-protocol and token
\* motion quiesces once the snapshot completes (SystemBusy gate). The state
\* where every process recorded and every channel closed is a correct TERMINAL
\* state, NOT a livelock, so deadlock checking is intentionally disabled:
\*   java -cp specs/tla2tools.jar tlc2.TLC -deadlock \
\*        -config specs/ChandyLamport.cfg specs/ChandyLamport.tla
SPECIFICATION Spec

CONSTANTS
    Procs = {p1, p2}

SYMMETRY Symmetry

INVARIANT TypeOK
INVARIANT ConsistentSnapshot
INVARIANT SnapshotConsistencyAlways
INVARIANT NoChannelDoubleClose
