\* TLC configuration for the SWIM membership / failure-detection spec.
\* 3 nodes, incarnations 0..2, suspicion timeout 2. Small enough to explore the
\* FULL finite state space, yet large enough for the meaningful adversarial run:
\* real message loss can drive a node to suspect/dead, the node can refute by
\* bumping its incarnation (0->1->2: two full refutation rounds), and gossip can
\* race a stale dead@c against a fresh alive@(c+1). That race is exactly what
\* breaks NoFalsePermanentDeath / IncarnationMonotonicity under a wrong rule.
\* MaxInc=1 already exercises that race (dead@0 vs alive@1 — one full refutation
\* round); combined with SYMMETRY over the interchangeable node ids it lets TLC
\* exhaustively explore the FULL finite state space to completion.
SPECIFICATION Spec

CONSTANTS
    Nodes          = {n1, n2, n3}
    MaxInc         = 1
    SuspectTimeout = 2

SYMMETRY Symmetry

INVARIANT TypeOK
INVARIANT NoFalsePermanentDeath
INVARIANT IncarnationMonotonicity
INVARIANT ViewWellFormed
