syntax = "proto3";
package helix.v1;
option go_package = "github.com/HelixDevelopment/helix_cluster/apiv1;helixv1";

message Node {
    string id = 1;
    string hostname = 2;
    repeated string ip_addresses = 3;
    string wg_pubkey = 4;
    string spiffe_id = 5;
    string status = 6;
    string role = 7;
    NodeResources resources = 8;
    map<string, string> labels = 9;
    string region = 10;
    string version = 11;
    // HXC-1293: node classification fields. Appended after the existing max
    // field number (11) to stay backward-compatible — never renumber 1..11.
    string tier = 12;
    string trust_level = 13;
    string compute_class = 14;
    string arch = 15;
    // HXC-1165: per-node thermal state, surfaced for thermal-aware scheduling.
    NodeThermal thermal = 16;
}

// NodeThermal (HXC-1165) carries a node's measured thermal state so the
// scheduler can avoid placing work on overheating / throttling hardware.
message NodeThermal {
    double thermal_celsius = 1;
    string thermal_state = 2;
}

message NodeResources {
    CPUResources cpu = 1;
    MemoryResources memory = 2;
    repeated GPUResource gpus = 3;
    StorageResources storage = 4;
    NetworkResources network = 5;
    // HXC-1294: accelerator capacity fields. Appended after the existing max
    // field number (5) to stay backward-compatible — never renumber 1..5.
    // npu_tops: NPU compute capacity in tera-ops/sec (INT8).
    double npu_tops = 6;
    // fpga_logic_elements: total FPGA logic elements available across fabrics.
    int64 fpga_logic_elements = 7;
    // tflops_gpu: aggregate GPU compute capacity in TFLOPS (FP32).
    double tflops_gpu = 8;
}

message CPUResources {
    string arch = 1;
    int32 cores = 2;
    int32 threads = 3;
    string model = 4;
}

message MemoryResources {
    int64 total_bytes = 1;
    int64 available_bytes = 2;
}

message GPUResource {
    string id = 1;
    string vendor = 2;
    string model = 3;
    string driver_version = 4;
    string api = 5;
    int64 total_memory = 6;
    int32 compute_units = 7;
}

message StorageResources {
    int64 total_bytes = 1;
    int64 available_bytes = 2;
}

message NetworkResources {
    repeated string interfaces = 1;
    int64 bandwidth_bps = 2;
}

message Session {
    string id = 1;
    string name = 2;
    string owner = 3;
    string status = 4;
    string mode = 5;
    string backend = 6;
    string node_id = 7;
    ResourceAllocation resources = 8;
}

message ResourceAllocation {
    int32 cpu_millicores = 1;
    int64 memory_bytes = 2;
    repeated string gpu_ids = 3;
}

message HealthScore {
    string node_id = 1;
    int32 overall = 2;
    map<string, int32> components = 3;
}

message Capability {
    string name = 1;
    string type = 2;
    string version = 3;
    int32 quantity = 4;
    map<string, string> attributes = 5;
}
