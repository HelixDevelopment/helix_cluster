# HelixCluster trivy suppressions (HXC-946)
# ---------------------------------------------------------------------------
# Auto-discovered by `trivy fs` from the repo root (see scripts/security/
# security-scan.sh). Every entry below is NARROWLY scoped to explicit paths
# and carries an honest justification. This file is NOT a blanket severity
# downgrade and contains NO real-misconfig suppressions — genuine hardening
# findings in first-party manifests were FIXED in the manifests themselves
# (pod/container securityContext, readOnlyRootFilesystem, non-root USER).
#
# Format: trivy 0.71 `.trivyignore.yaml` (id + paths + statement).
# ---------------------------------------------------------------------------

# ===========================================================================
# 0) VULNERABILITY false positives — vendored telebot lockfile (HXC-944 parts 2/3)
# ===========================================================================
# trivy scans Herald/submodules/telebot's STANDALONE go.mod/go.sum in isolation
# and reports the 2 CRITICAL CVEs below against transitive version FLOORS that
# are never selected by the real build. telebot is consumed only via a `replace`
# directive in Herald/commons_messaging and Herald/qaherald; Go's minimal-version
# selection across those modules elevates the effective versions FAR past the fix:
#   go list -m golang.org/x/crypto  -> v0.52.0  (CVE-2024-45337 fixed at 0.31.0)
#   go list -m google.golang.org/grpc -> v1.81.1 (CVE-2026-33186 fixed at 1.79.3)
# in BOTH consuming modules (re-runnable proof). The only telebot code path that
# could pull these (telebot/layout -> viper) is unused by Herald. The vendored
# go.mod is third-party pinned (CONST-051) and not editable from this superproject.
# Scoped to the exact vendored path + the 2 in-scope CRITICAL IDs only.
vulnerabilities:
  - id: CVE-2024-45337
    paths:
      - "Herald/submodules/telebot/go.mod"
    statement: >-
      Transitive-only floor in the vendored telebot lockfile (x/crypto
      v0.0.0-2022...). Never selected: the real consuming modules
      (Herald/commons_messaging, Herald/qaherald) resolve x/crypto v0.52.0,
      well past the 0.31.0 fix. telebot/layout (the only viper path) is unused.
  - id: CVE-2026-33186
    paths:
      - "Herald/submodules/telebot/go.mod"
    statement: >-
      Transitive-only floor in the vendored telebot lockfile (grpc v1.46.2).
      Never selected: the real consuming modules resolve grpc v1.81.1, past the
      1.79.3 fix. Vendored third-party go.mod is pinned (CONST-051), not editable
      here; bumping telebot would not change the already-patched resolved graph.

# ===========================================================================
# 1) SECRET false positives — deliberate ANTI-LEAK sentinel tokens
# ===========================================================================
# These are NOT real credentials. They are placeholder sentinel strings
# ("...-must-not-leak-7777") planted by Herald's QA suite to PROVE that a
# Slack access token is redacted / never written to logs or errors. The
# transcripts literally assert the token MUST NOT appear in output. Suppressed
# narrowly to the three QA-fixture/transcript paths that carry the sentinel.
secrets:
  - id: slack-access-token
    paths:
      - "Herald/docs/Fixed.html"
      - "Herald/docs/qa/HRD-116-20260528T090000Z/transcript.txt"
      - "Herald/docs/qa/HRD-133-20260528T140000Z/transcript.txt"
    statement: >-
      Deliberate anti-leak sentinel token used by Herald QA to assert that
      Slack credentials are redacted and never leak into logs/errors. Not a
      real secret; the fixtures assert this exact string is ABSENT from output.

# ===========================================================================
# 2) MISCONFIG — third-party submodule manifests (tracked in their own repos)
# ===========================================================================
# containers/, helixqa/, and Herald/ are git submodules with independent
# upstream repositories. We cannot and must not edit their files from this
# superproject; their hardening is owned and tracked upstream. Scoped per ID
# to submodule paths only.
misconfigurations:
  # --- DS-0002: image user should not be 'root' (submodule Dockerfiles) ---
  - id: DS-0002
    paths:
      - "containers/images/android-test/Dockerfile"
      - "containers/images/core/Dockerfile"
      - "containers/images/discovery/Dockerfile"
      - "containers/images/host-agent/Dockerfile"
      - "containers/pkg/crossbuild/linux_container.Containerfile"
      - "containers/pkg/crossbuild/windows_wine.Containerfile"
      - "helixqa/Dockerfile"
      - "helixqa/docker/mediamtx/Dockerfile"
      - "helixqa/docker/base-opencv-gstreamer/Dockerfile"
      - "Herald/containers/images/android-test/Dockerfile"
      - "Herald/containers/images/core/Dockerfile"
      - "Herald/containers/images/discovery/Dockerfile"
      - "Herald/containers/images/host-agent/Dockerfile"
      - "Herald/containers/pkg/crossbuild/linux_container.Containerfile"
      - "Herald/containers/pkg/crossbuild/windows_wine.Containerfile"
      - "Herald/submodules/gotd-td/cmd/connclose/Dockerfile"
      - "pkg/build/testdata/fixture/Dockerfile"
    statement: >-
      Submodule-owned Dockerfiles (containers/, helixqa/, Herald/) are tracked
      and hardened in their own upstream repos — not editable from this
      superproject. pkg/build/testdata/fixture/Dockerfile is a frozen test
      fixture (FROM busybox; RUN true) consumed verbatim by the build unit
      tests; adding a USER would change the fixture the tests assert on, not
      improve any shipped image.

  # --- DS-0029: apt-get missing --no-install-recommends (submodule images) ---
  - id: DS-0029
    paths:
      - "containers/images/host-agent/Dockerfile"
      - "Herald/containers/images/host-agent/Dockerfile"
    statement: >-
      Submodule-owned Dockerfile (containers/ submodule, vendored under Herald/
      too); hardened upstream, not editable from this superproject.

  # --- gotd-td example manifest (vendored submodule under Herald/) ---
  - id: KSV-0014
    paths:
      - "Herald/submodules/gotd-td/cmd/connclose/deployment.yml"
    statement: >-
      Vendored third-party example manifest inside the gotd-td submodule
      (Herald/submodules/gotd-td). Owned upstream; not a HelixCluster-shipped
      workload and not editable from this superproject.
  - id: KSV-0118
    paths:
      - "Herald/submodules/gotd-td/cmd/connclose/deployment.yml"
      # --- intentional: privileged host-introspection DaemonSet (see below) ---
      - "deploy/k8s/agent-daemonset.yaml"
      - "deploy/helm/templates/agent.yaml"
    statement: >-
      gotd-td path: vendored third-party example, owned upstream. agent-
      daemonset / helm agent: the helix-agent node DaemonSet MUST run
      privileged as root to read the host's real /proc and /sys for measured
      resource reporting (CLAUDE-2 — no mock host metrics), so a non-root pod
      securityContext (KSV-0118) is intentionally not applied. The container
      rootfs is still locked read-only and host mounts are readOnly.

  # ===========================================================================
  # 3) MISCONFIG — intentional design of the privileged host-agent DaemonSet
  # ===========================================================================
  # helix-agent is a node-local introspection agent. It deliberately uses host
  # network, a host port, privileged mode, and read-only hostPath mounts of
  # /proc and /sys so it can report the node's REAL resource state (CLAUDE-2:
  # no mock/stub host metrics). These are inherent to the feature, not
  # oversights. We still hardened what we safely could (readOnlyRootFilesystem
  # is set on the container; host mounts are readOnly).
  - id: KSV-0009  # access to host network
    paths:
      - "deploy/k8s/agent-daemonset.yaml"
      - "deploy/helm/templates/agent.yaml"
    statement: >-
      helix-agent uses hostNetwork by design to expose its gRPC port on the
      node and observe node-level networking; required for the node-agent role.
  - id: KSV-0017  # privileged container
    paths:
      - "deploy/k8s/agent-daemonset.yaml"
      - "deploy/helm/templates/agent.yaml"
    statement: >-
      privileged is required for the agent to introspect the host's real /proc
      and /sys (measured resource reporting, CLAUDE-2 — no mock host metrics).
  - id: KSV-0024  # access to host ports
    paths:
      - "deploy/k8s/agent-daemonset.yaml"
      - "deploy/helm/templates/agent.yaml"
    statement: >-
      The agent binds a fixed hostPort so the control plane can reach each
      node's agent at a stable address; inherent to the DaemonSet design.
  - id: KSV-0121  # disallowed volumes mounted (hostPath)
    paths:
      - "deploy/k8s/agent-daemonset.yaml"
      - "deploy/helm/templates/agent.yaml"
    statement: >-
      Read-only hostPath mounts of /proc and /sys are the whole point of the
      host-introspection agent (CLAUDE-2); mounted readOnly: true.
