context: tracked_docs
description: >
  HelixCluster constitution-tracked documents (§11.4.44/§11.4.65). Each canonical
  Markdown source derives html + pdf + docx exports into docs/export/. Driven by the
  docs_chain engine (§11.4.106) — supersedes the ad-hoc scripts/docs/generate.sh.
nodes:
  # --- continuation (§12.10) ---
  cont_md:   { kind: markdown, path: docs/continuation.md }
  cont_html: { kind: html,     path: docs/export/continuation.html }
  cont_pdf:  { kind: pdf,      path: docs/export/continuation.pdf }
  cont_docx: { kind: docx,     path: docs/export/continuation.docx }
  # --- issues (§11.4.93 single source of truth — markdown view) ---
  iss_md:    { kind: markdown, path: docs/issues.md }
  iss_html:  { kind: html,     path: docs/export/issues.html }
  iss_pdf:   { kind: pdf,      path: docs/export/issues.pdf }
  iss_docx:  { kind: docx,     path: docs/export/issues.docx }
  # --- issues_summary (§11.4.12) ---
  issum_md:   { kind: markdown, path: docs/issues_summary.md }
  issum_html: { kind: html,     path: docs/export/issues_summary.html }
  issum_pdf:  { kind: pdf,      path: docs/export/issues_summary.pdf }
  issum_docx: { kind: docx,     path: docs/export/issues_summary.docx }
