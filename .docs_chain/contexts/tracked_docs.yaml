context: tracked_docs
description: >
  HelixCluster constitution-tracked documents (§11.4.44/§11.4.65). Each canonical
  Markdown source derives html + pdf + docx exports into docs/export/. Driven by the
  docs_chain engine (§11.4.106) — supersedes the ad-hoc scripts/docs/generate.sh.
nodes:
  # --- continuation (§12.10) ---
  cont_md:   { kind: markdown, path: docs/continuation.md }
  cont_html: { kind: html,     path: docs/export/continuation.html }
  cont_pdf:  { kind: pdf,      path: docs/export/continuation.pdf }
  cont_docx: { kind: docx,     path: docs/export/continuation.docx }
  # --- issues (§11.4.93 single source of truth — markdown view) ---
  iss_md:    { kind: markdown, path: docs/issues.md }
  iss_html:  { kind: html,     path: docs/export/issues.html }
  iss_pdf:   { kind: pdf,      path: docs/export/issues.pdf }
  iss_docx:  { kind: docx,     path: docs/export/issues.docx }
  # --- issues_summary (§11.4.12) ---
  issum_md:   { kind: markdown, path: docs/issues_summary.md }
  issum_html: { kind: html,     path: docs/export/issues_summary.html }
  issum_pdf:  { kind: pdf,      path: docs/export/issues_summary.pdf }
  issum_docx: { kind: docx,     path: docs/export/issues_summary.docx }
  # --- fixed (§11.4.19) ---
  fx_md:    { kind: markdown, path: docs/fixed.md }
  fx_html:  { kind: html,     path: docs/export/fixed.html }
  fx_pdf:   { kind: pdf,      path: docs/export/fixed.pdf }
  fx_docx:  { kind: docx,     path: docs/export/fixed.docx }
  # --- fixed_summary (§11.4.53) ---
  fxsum_md:   { kind: markdown, path: docs/fixed_summary.md }
  fxsum_html: { kind: html,     path: docs/export/fixed_summary.html }
  fxsum_pdf:  { kind: pdf,      path: docs/export/fixed_summary.pdf }
  fxsum_docx: { kind: docx,     path: docs/export/fixed_summary.docx }
  # --- HXC_REGISTRY ---
  reg_md:    { kind: markdown, path: docs/HXC_REGISTRY.md }
  reg_html:  { kind: html,     path: docs/export/HXC_REGISTRY.html }
  reg_pdf:   { kind: pdf,      path: docs/export/HXC_REGISTRY.pdf }
  reg_docx:  { kind: docx,     path: docs/export/HXC_REGISTRY.docx }
  # --- main README (§11.4.57 doc-link section + §11.4.59 always-sync export) ---
  readme_md:   { kind: markdown, path: README.md }
  readme_html: { kind: html,     path: docs/export/README.html }
  readme_pdf:  { kind: pdf,      path: docs/export/README.pdf }
  readme_docx: { kind: docx,     path: docs/export/README.docx }
  # --- CHANGELOG (§5 changelog discipline + multi-format export) ---
  chlog_md:   { kind: markdown, path: CHANGELOG.md }
  chlog_html: { kind: html,     path: docs/export/CHANGELOG.html }
  chlog_pdf:  { kind: pdf,      path: docs/export/CHANGELOG.pdf }
  chlog_docx: { kind: docx,     path: docs/export/CHANGELOG.docx }
  # --- foundation-package catalogue (kept in sync as packages are added) ---
  found_md:   { kind: markdown, path: docs/FOUNDATION_PACKAGES.md }
  found_html: { kind: html,     path: docs/export/FOUNDATION_PACKAGES.html }
  found_pdf:  { kind: pdf,      path: docs/export/FOUNDATION_PACKAGES.pdf }
  found_docx: { kind: docx,     path: docs/export/FOUNDATION_PACKAGES.docx }
  # --- governance docs (CLAUDE-3 / AGENT-2 / QWEN-2 — restated docs-sync rule kept exported) ---
  claude_md:   { kind: markdown, path: CLAUDE.md }
  claude_html: { kind: html,     path: docs/export/CLAUDE.html }
  claude_pdf:  { kind: pdf,      path: docs/export/CLAUDE.pdf }
  claude_docx: { kind: docx,     path: docs/export/CLAUDE.docx }
  agents_md:   { kind: markdown, path: AGENTS.md }
  agents_html: { kind: html,     path: docs/export/AGENTS.html }
  agents_pdf:  { kind: pdf,      path: docs/export/AGENTS.pdf }
  agents_docx: { kind: docx,     path: docs/export/AGENTS.docx }
  qwen_md:   { kind: markdown, path: QWEN.md }
  qwen_html: { kind: html,     path: docs/export/QWEN.html }
  qwen_pdf:  { kind: pdf,      path: docs/export/QWEN.pdf }
  qwen_docx: { kind: docx,     path: docs/export/QWEN.docx }
  codegraph_md:   { kind: markdown, path: docs/CODEGRAPH.md }
  codegraph_html: { kind: html,     path: docs/export/CODEGRAPH.html }
  codegraph_pdf:  { kind: pdf,      path: docs/export/CODEGRAPH.pdf }
  codegraph_docx: { kind: docx,     path: docs/export/CODEGRAPH.docx }
  # --- architecture diagram + component map (HXC-1424; lint-enforced by pkg/archlint) ---
  arch_md:   { kind: markdown, path: docs/ARCHITECTURE.md }
  arch_html: { kind: html,     path: docs/export/ARCHITECTURE.html }
  arch_pdf:  { kind: pdf,      path: docs/export/ARCHITECTURE.pdf }
  arch_docx: { kind: docx,     path: docs/export/ARCHITECTURE.docx }
  # --- node-provisioning boundary (HXC-1146; provisions operator-controlled nodes, no device-security bypass) ---
  npbound_md:   { kind: markdown, path: docs/NODE_PROVISIONING_BOUNDARY.md }
  npbound_html: { kind: html,     path: docs/export/NODE_PROVISIONING_BOUNDARY.html }
  npbound_pdf:  { kind: pdf,      path: docs/export/NODE_PROVISIONING_BOUNDARY.pdf }
  npbound_docx: { kind: docx,     path: docs/export/NODE_PROVISIONING_BOUNDARY.docx }
edges:
  - { type: derive-from, from: cont_md,  to: cont_html, transform: md2html }
  - { type: derive-from, from: cont_html, to: cont_pdf, transform: html2pdf }
  - { type: derive-from, from: cont_md,  to: cont_docx, transform: md2docx }
  - { type: derive-from, from: iss_md,   to: iss_html,  transform: md2html }
  - { type: derive-from, from: iss_html, to: iss_pdf,   transform: html2pdf }
  - { type: derive-from, from: iss_md,   to: iss_docx,  transform: md2docx }
  - { type: derive-from, from: issum_md,   to: issum_html, transform: md2html }
  - { type: derive-from, from: issum_html, to: issum_pdf,  transform: html2pdf }
  - { type: derive-from, from: issum_md,   to: issum_docx, transform: md2docx }
  - { type: derive-from, from: fx_md,   to: fx_html,  transform: md2html }
  - { type: derive-from, from: fx_html, to: fx_pdf,   transform: html2pdf }
  - { type: derive-from, from: fx_md,   to: fx_docx,  transform: md2docx }
  - { type: derive-from, from: fxsum_md,   to: fxsum_html, transform: md2html }
  - { type: derive-from, from: fxsum_html, to: fxsum_pdf,  transform: html2pdf }
  - { type: derive-from, from: fxsum_md,   to: fxsum_docx, transform: md2docx }
  - { type: derive-from, from: reg_md,   to: reg_html,  transform: md2html }
  - { type: derive-from, from: reg_html, to: reg_pdf,   transform: html2pdf }
  - { type: derive-from, from: reg_md,   to: reg_docx,  transform: md2docx }
  - { type: derive-from, from: readme_md,   to: readme_html, transform: md2html }
  - { type: derive-from, from: readme_html, to: readme_pdf,  transform: html2pdf }
  - { type: derive-from, from: readme_md,   to: readme_docx, transform: md2docx }
  - { type: derive-from, from: chlog_md,   to: chlog_html, transform: md2html }
  - { type: derive-from, from: chlog_html, to: chlog_pdf,  transform: html2pdf }
  - { type: derive-from, from: chlog_md,   to: chlog_docx, transform: md2docx }
  - { type: derive-from, from: found_md,   to: found_html, transform: md2html }
  - { type: derive-from, from: found_html, to: found_pdf,  transform: html2pdf }
  - { type: derive-from, from: found_md,   to: found_docx, transform: md2docx }
  - { type: derive-from, from: claude_md,   to: claude_html, transform: md2html }
  - { type: derive-from, from: claude_html, to: claude_pdf,  transform: html2pdf }
  - { type: derive-from, from: claude_md,   to: claude_docx, transform: md2docx }
  - { type: derive-from, from: agents_md,   to: agents_html, transform: md2html }
  - { type: derive-from, from: agents_html, to: agents_pdf,  transform: html2pdf }
  - { type: derive-from, from: agents_md,   to: agents_docx, transform: md2docx }
  - { type: derive-from, from: qwen_md,   to: qwen_html, transform: md2html }
  - { type: derive-from, from: qwen_html, to: qwen_pdf,  transform: html2pdf }
  - { type: derive-from, from: qwen_md,   to: qwen_docx, transform: md2docx }
  - { type: derive-from, from: codegraph_md,   to: codegraph_html, transform: md2html }
  - { type: derive-from, from: codegraph_html, to: codegraph_pdf,  transform: html2pdf }
  - { type: derive-from, from: codegraph_md,   to: codegraph_docx, transform: md2docx }
  - { type: derive-from, from: arch_md,   to: arch_html, transform: md2html }
  - { type: derive-from, from: arch_html, to: arch_pdf,  transform: html2pdf }
  - { type: derive-from, from: arch_md,   to: arch_docx, transform: md2docx }
  - { type: derive-from, from: npbound_md,   to: npbound_html, transform: md2html }
  - { type: derive-from, from: npbound_html, to: npbound_pdf,  transform: html2pdf }
  - { type: derive-from, from: npbound_md,   to: npbound_docx, transform: md2docx }
transforms:
  md2html:  { builtin: pandoc-html }
  html2pdf: { builtin: weasyprint-pdf }
  md2docx:  { builtin: pandoc-docx }
