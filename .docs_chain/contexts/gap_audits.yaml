context: gap_audits
description: >
  Per-phase GAP_AUDIT.md files (HXC-939, CLAUDE-3 / §11.4.106). Each canonical
  Markdown audit under docs/research/*/GAP_AUDIT.md derives html + pdf + docx
  exports into docs/export/gap_audits/. Driven by the docs_chain engine so the
  3-axis (implemented / wired / tested) audits are kept in sync out of the box.
  The "wired" axis is mechanically grounded in `go list -deps ./cmd/...`
  reachability; a stale audit is treated as a failing test (§11.4.106).
