schema_version: 1
tiers:
  # T1 — micro: deeply-constrained embedded / MCU-class device.
  - tier: T1
    min_cpu_cores: 1
    min_memory_mb: 256
    min_gpu: 0
    min_gpu_vram_mb: 0
    min_network_mbps: 10
    max_power_w: 5.0

  # T2 — handheld: low-power battery SBC / phone-class.
  - tier: T2
    min_cpu_cores: 2
    min_memory_mb: 512
    min_gpu: 0
    min_gpu_vram_mb: 0
    min_network_mbps: 100
    max_power_w: 15.0

  # T3 — SBC/edge: Raspberry-Pi-class, no discrete accelerator.
  - tier: T3
    min_cpu_cores: 4
    min_memory_mb: 2048
    min_gpu: 0
    min_gpu_vram_mb: 0
    min_network_mbps: 1000
    max_power_w: 25.0

  # T4 — workstation-lite: modest desktop, iGPU acceptable.
  - tier: T4
